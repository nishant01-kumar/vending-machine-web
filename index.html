<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vending Machine</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section id="product-page">
      <div class="product-list">
        <div class="head">
          <h3>Vending Machine</h3>
          <div class="cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge">0</span>
          </div>
        </div>
        <div class="item-list"></div>
        <div class="basic-info">
          <p class="clr notify-btn">Click "+" to add items cart</p>
        </div>
      </div>
    </section>

    <section id="cart-page" class="hidden">
      <div class="cart-list">
        <div class="head">
          <i class="fa-solid fa-chevron-left backTocart" title="Back"></i>
          <h3>Your cart</h3>
          <div class="cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge">0</span>
          </div>
        </div>
        <div class="cart-item-list"></div>
        <div class="payment-area">
          <div class="total-amount">
            <p>Total Amount</p>
            <span class="clr totalItem-price">₹ 0</span>
          </div>
          <button class="payment-btn">Proceed To Payment</button>
        </div>
      </div>
    </section>

    <section id="review-page" class="hidden">
      <div class="final-check-list">
        <div class="review-order">
          <i class="fa-solid fa-chevron-left backTocart" title="Back"></i>
          <p>Review Your Order</p>
        </div>
        <div class="order-list">
          <div class="review-item">
            <p class="item-name">Coke</p>
            <p class="Quantity">X2</p>
            <p class="item-price">₹ 0</p>
          </div>
        </div>
        <div class="payment-area">
          <div class="sub-total">
            <p>Subtotal</p>
            <span class="sub-price">₹ 0</span>
          </div>
          <div class="total-amount">
            <p>Total Amount</p>
            <span class="clr totalItem-price">₹ 0</span>
          </div>
          <div class="alert-info">
            <span class="info">
              <i class="fa-solid fa-circle-info"></i>
              Please check your order before proceed to payment.</span
            >
          </div>
          <button class="payment-btn">Continue to Payment</button>
        </div>
      </div>
    </section>

    <section id="payment-page" class="hidden">
      <div class="payment-select-bar">
        <div class="sct-payment-type">
          <i class="fa-solid fa-chevron-left backTocart" title="Back"></i>
          <p>Select payment Method</p>
        </div>

        <div class="payment-methods">
          <button class="cash btn-payment">Cash</button>
          <button class="upi btn-payment">UPI</button>
          <button class="card btn-payment">Card</button>
        </div>

        <div class="payment-inp-wrapper">
          <label for="pay-inp">
            <span>Enter Amount</span>
          </label>
          <div class="payment-inp-box">
            <i class="fa-solid fa-indian-rupee-sign"></i>
            <input
              type="number"
              id="pay-inp"
              class="cash-inp"
              placeholder="0"
            />
          </div>
          <button class="payment-btn">Pay Now</button>
        </div>

        <div class="total-payable">
          <p class="clr total-pay">Total Payable: ₹ 0</p>
          <p class="change-note">You will get change after payment.</p>
        </div>
      </div>
    </section>
    <script src="/script.js"></script>
  </body>
</html>
