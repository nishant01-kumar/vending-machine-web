<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vending Machine</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section id="product-page">
      <div class="product-list">
        <div class="head">
          <h3>Vending Machine</h3>
          <div class="cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge">0</span>
          </div>
        </div>
        <div class="item-list"></div>
        <div class="basic-info">
          <p class="clr notify-btn">Click "+" to add items cart</p>
        </div>
      </div>
    </section>

    <section id="cart-page" class="hidden">
      <div class="product-list">
        <div class="head">
          <h3>Your cart</h3>
          <div class="cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge">0</span>
          </div>
        </div>
        <div class="item-list">
          <div class="item">
            <img src="/assets/cokeImg.png" alt="coke" />
            <div class="item-info">
              <p class="product-name">Coke</p>
              <span class="clr"
                ><i class="fa-solid fa-indian-rupee-sign"></i>40</span
              >
            </div>
            <div class="quantity-box">
              <button class="minus">−</button>

              <span class="count">1</span>

              <button class="plus">+</button>
            </div>
            <div class="price-item">
              <span class="clr total-price"
                ><i class="fa-solid fa-indian-rupee-sign"></i>80</span
              >
              <i class="fa-regular fa-trash-can cancel-item"></i>
            </div>
          </div>

          <div class="item">
            <img src="/assets/dairyImg.png" alt="coke" />
            <div class="item-info">
              <p class="product-name">Dairy Milk</p>
              <span class="clr"
                ><i class="fa-solid fa-indian-rupee-sign"></i>40</span
              >
            </div>
            <div class="quantity-box">
              <button class="minus">−</button>

              <span class="count">1</span>

              <button class="plus">+</button>
            </div>
            <div class="price-item">
              <span class="clr total-price"
                ><i class="fa-solid fa-indian-rupee-sign"></i>80</span
              >
              <i class="fa-regular fa-trash-can cancel-item"></i>
            </div>
          </div>

          <div class="item">
            <img src="/assets/chipsImg.png" alt="coke" />
            <div class="item-info">
              <p class="product-name">Chips</p>
              <span class="clr"
                ><i class="fa-solid fa-indian-rupee-sign"></i>30</span
              >
            </div>
            <div class="quantity-box">
              <button class="minus">−</button>

              <span class="count">1</span>

              <button class="plus">+</button>
            </div>
            <div class="price-item">
              <span class="clr total-price"
                ><i class="fa-solid fa-indian-rupee-sign"></i>30</span
              >
              <i class="fa-regular fa-trash-can cancel-item"></i>
            </div>
          </div>

          <div class="item">
            <img src="/assets/spiteImg.png" alt="coke" />
            <div class="item-info">
              <p class="product-name">Sprite</p>
              <span class="clr"
                ><i class="fa-solid fa-indian-rupee-sign"></i>20</span
              >
            </div>
            <div class="quantity-box">
              <button class="minus">−</button>

              <span class="count">1</span>

              <button class="plus">+</button>
            </div>
            <div class="price-item">
              <span class="clr total-price"
                ><i class="fa-solid fa-indian-rupee-sign"></i>20</span
              >
              <i class="fa-regular fa-trash-can cancel-item"></i>
            </div>
          </div>
          <div class="payment-area">
            <div class="total-amount">
              <p>Total Amount</p>
              <span class="clr"
                ><i class="fa-solid fa-indian-rupee-sign"></i>130</span
              >
            </div>
            <button class="payment-btn">Proceed To Payment</button>
          </div>
        </div>
      </div>
    </section>
    <section id="payment-page" class="hidden">
      <div class="payment-card">
        <h3>Select Payment Method</h3>
      </div>
    </section>
    <script src="/script.js"></script>
  </body>
</html>
